<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservation | ABC's Restaurant</title>

    <link rel="stylesheet" href="reservation.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <a href="home.html">ABC's</a>
            </div>

            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="orders.html">My Orders</a></li>
                <li><a href="reservation.html">Reservation</a></li>
            </ul>

            <a href="menu.html" class="order-btn">
                Order Now
            </a>

        </nav>
    </header>


    <!-- Reservation Header -->
    <section class="reservation-header">

        <p class="section-label">RESERVATION</p>

        <h1>Reserve Your Table</h1>

        <p>
            Book a table with us and enjoy a comfortable dining experience.
        </p>

    </section>


    <!-- Reservation Form -->
    <main class="reservation-container">

        <section class="reservation-form">

            <h2>Make a Reservation</h2>

            <form id="reservation-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Full Name</label>

                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>


                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="date">Date</label>

                        <input type="date" id="date" required>
                    </div>


                    <div class="form-group">
                        <label for="time">Time</label>

                        <input type="time" id="time" required>
                    </div>

                </div>


                <div class="form-group">
                    <label for="guests">Number of Guests</label>

                    <select id="guests" required>

                        <option value="">
                            Select number of guests
                        </option>

                        <option value="1">
                            1 Guest
                        </option>

                        <option value="2">
                            2 Guests
                        </option>

                        <option value="3">
                            3 Guests
                        </option>

                        <option value="4">
                            4 Guests
                        </option>

                        <option value="5">
                            5 Guests
                        </option>

                        <option value="6">
                            6 Guests
                        </option>

                        <option value="7+">
                            7+ Guests
                        </option>

                    </select>
                </div>


                <div class="form-group">

                    <label for="requests">
                        Special Requests
                    </label>

                    <textarea id="requests" rows="5" placeholder="Any special requests or notes?"></textarea>

                </div>


                <button type="submit" class="reserve-btn">
                    Reserve Table
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ABC's Restaurant. All rights reserved.</p>
    </footer>


    <!-- JavaScript -->
    <script>

        const reservationForm =
            document.getElementById("reservation-form");


        reservationForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                alert("Your table has been reserved successfully!");

                reservationForm.reset();

            }
        );

    </script>

</body>

</html>
